<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>
        {{ app_name }}
    </title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: #f3f4f6;
            color: #111827;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 18px 28px;
        }

        header h1 {
            margin: 0;
            font-size: 21px;
        }

        main {
            max-width: 1300px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .breadcrumbs {
            background: white;
            padding: 14px 18px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .breadcrumbs a {
            color: #2563eb;
            text-decoration: none;
        }

        .breadcrumbs span {
            margin: 0 7px;
            color: #9ca3af;
        }

        .card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow:
                0 1px 2px
                rgba(0, 0, 0, 0.05);
        }

        .card-header {
            padding: 15px 18px;
            font-weight: 600;
            border-bottom:
                1px solid #e5e7eb;
        }

        .item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 13px 18px;
            border-bottom:
                1px solid #f3f4f6;
        }

        .item:last-child {
            border-bottom: 0;
        }

        .item-name {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        a {
            color: #2563eb;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        button {
            border: 0;
            border-radius: 6px;
            padding: 8px 14px;
            cursor: pointer;
            background: #2563eb;
            color: white;
            font-size: 14px;
        }

        button:hover {
            opacity: .9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 11px 14px;
            text-align: left;
            border-bottom:
                1px solid #e5e7eb;
        }

        th {
            background: #f9fafb;
            font-size: 13px;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            background: #e5e7eb;
            font-size: 12px;
        }

        .badge.ass {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .badge.en {
            background: #dcfce7;

            color: #166534;
        }

        .empty {
            padding: 25px;
            text-align: center;
            color: #6b7280;
        }

        .back {
            margin-bottom: 15px;
        }

        code {
            background: #f3f4f6;
            padding: 3px 6px;
            border-radius: 4px;
            word-break: break-all;
        }
    </style>
</head>
<body>
<header>
    <h1>
        {{ app_name }}
    </h1>
</header>
<main>
    {% block content %}
    {% endblock %}
</main>
</body>
</html>
